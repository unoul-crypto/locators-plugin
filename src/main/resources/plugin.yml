name: Locators
version: '1.3.0'
main: dev.locators.LocatorsPlugin
api-version: '1.16'
description: Настраиваемые предметы-локаторы для поиска игроков
softdepend: [LuckPerms]
commands:
  locators:
    description: Управление локаторами
    usage: /locators <give|reload|resetTypeCooldown>
    aliases: [locator]
permissions:
  locators.reload:
    description: Перезагрузка locators.json
    default: op
  locators.resetcooldown:
    description: Сброс cooldown локаторов режима 1
    default: op
